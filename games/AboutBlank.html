<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            color: #ffffff;
        }

        .container {
            background-color: #2d2d2d;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            width: 300px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #444;
            border-radius: 4px;
            box-sizing: border-box;
            background-color: #333;
            color: white;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Link Cloaker</h1>
        <input type="text" id="urlInput" placeholder="https://example.com" />
        <button id="cloakerBtn">Open Cloaked</button>
    </div>

    <script>
        document.getElementById('cloakerBtn').addEventListener('click', function() {
            const url = document.getElementById('urlInput').value;
            
            if (!url) {
                alert("Please enter a URL");
                return;
            }

            // Ensure the URL has a protocol
            let finalUrl = url;
            if (!/^https?:\/\//i.test(url)) {
                finalUrl = 'https://' + url;
            }

            // Open the cloaker
            cloaker(finalUrl);
        });

        function cloaker(targetUrl) {
            // 1. Open a new window/tab
            const newTab = window.open('about:blank', '_blank');

            if (!newTab) {
                alert('Popup blocked! Please allow popups for this site.');
                return;
            }

            // 2. Write the HTML content to the new tab
            // We use a simple template string to inject the iframe
            newTab.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>...</title> <!-- Hidden title -->
                    <style>
                        body, html {
                            margin: 0;
                            padding: 0;
                            width: 100%;
                            height: 100%;
                            overflow: hidden;
                            background: #fff;
                        }
                        iframe {
                            width: 100%;
                            height: 100%;
                            border: none;
                            display: block;
                        }
                    </style>
                </head>
                <body>
                    <iframe src="${targetUrl}"></iframe>
                </body>
                </html>
            `);
            
            // 3. Close the document stream to trigger rendering
            newTab.document.close();
        }
    </script>
</body>
</html>
