```yaml
name: 💡 Feature Request
description: Suggest a new feature, improvement, or game.
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        ## 💡 Have an idea?

        Tell us what you'd like to see added to Arcade Cabinet!

  - type: textarea
    id: idea
    attributes:
      label: What would you like to add?
      description: Describe your idea.
      placeholder: I think Arcade Cabinet should have...
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why would this be useful?
      description: Explain what this would add to the website.
      placeholder: This would make the website better because...
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: How could it work?
      description: If you have an idea for how it should work, describe it here.
      placeholder: It could work like this...

  - type: textarea
    id: examples
    attributes:
      label: Examples or references
      description: Link or describe anything that inspired your idea.
      placeholder: Games, websites, screenshots, videos, etc.
```
