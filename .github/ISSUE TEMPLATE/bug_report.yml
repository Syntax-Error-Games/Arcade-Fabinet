```yaml
name: 🐛 Bug Report
description: Report something that isn't working correctly.
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Thanks for reporting a bug!

        Please provide as much information as possible so it can be reproduced and fixed.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem you encountered.
      placeholder: Tell us what went wrong...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
      description: Describe what you expected to happen.
      placeholder: I expected...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Tell us how to reproduce the problem.
      placeholder: |
        1. Open the Arcade Cabinet
        2. Open a game
        3. Press...
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Windows PC
        - Mac
        - iPhone
        - iPad
        - Android phone
        - Android tablet
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: Which browser are you using?
      placeholder: Chrome, Edge, Safari, Firefox, etc.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or videos
      description: If possible, drag screenshots or videos into this box.
      placeholder: Drag and drop screenshots or videos here...

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Anything else that might help?
      placeholder: Anything else we should know?
```
